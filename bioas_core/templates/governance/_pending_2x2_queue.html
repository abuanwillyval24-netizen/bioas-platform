{% for pc in pending_photo_citizens %}<div class="card" style="border-left:5px solid #f59e0b;background:#fffbeb;margin-bottom:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;"><img src="{{ pc.pending_photo_data_uri }}" style="width:62px;height:62px;border-radius:8px;object-fit:cover;border:2px solid #d97706;"><div style="flex:1;min-width:200px;"><strong style="color:#92400e;font-size:.86rem;">&#128247; Pending 2&times;2 ID Photo Review: {{ pc.full_name }} ({{ pc.citizen_qr_id }})</strong><div style="font-size:.75rem;color:#78350f;">{{ pc.purok }} &bull; Approve to publish on Digital ID, Shared Gallery &amp; 201 Registry (locks for 90 days), or reject with reason.</div></div><form method="post" action="/citizen-photo-review/{{ pc.id }}/" style="display:flex;gap:6px;flex-wrap:wrap;">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><a href="/citizen-inspect/{{ pc.id }}/" target="_blank" style="background:#1e3a8a;color:#fff;padding:6px 11px;border-radius:6px;font-size:.75rem;font-weight:800;text-decoration:none;">Inspect 201 &nearr;</a><button type="submit" name="decision" value="APPROVE" style="background:#16a34a;color:#fff;border:0;padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:800;cursor:pointer;">&check; Approve 2&times;2</button><button type="button" onclick="var r=prompt('Enter rejection reason (e.g., Informal selfie / background not plain):');if(r){var f=this.form;var i=document.createElement('input');i.type='hidden';i.name='rejection_reason';i.value=r;f.appendChild(i);var d=document.createElement('input');d.type='hidden';d.name='decision';d.value='REJECT';f.appendChild(d);f.submit();}" style="background:#dc2626;color:#fff;border:0;padding:6px 12px;border-radius:6px;font-size:.75rem;font-weight:800;cursor:pointer;">&times; Reject</button></form></div>{% endfor %}
